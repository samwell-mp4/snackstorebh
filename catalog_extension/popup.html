<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Importador de Catálogo</title>
  <style>
    :root {
      --snack-green: #1E4018;
      --snack-gold: #c4a15a;
      --snack-cream: #F6F2E9;
      --snack-text: #1a1a1a;
      --snack-paper: #ffffff;
      --snack-border: #eaeaea;
    }
    body {
      width: 420px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--snack-cream);
      color: var(--snack-text);
      display: flex;
      flex-direction: column;
      height: 560px;
    }
    header {
      background-color: var(--snack-green);
      color: var(--snack-cream);
      padding: 16px 20px;
      border-bottom: 2px solid var(--snack-gold);
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    header p {
      margin: 4px 0 0 0;
      font-size: 11px;
      opacity: 0.8;
      letter-spacing: 0.5px;
    }
    .search-container {
      padding: 12px 16px;
      background-color: var(--snack-paper);
      border-bottom: 1px solid var(--snack-border);
      display: flex;
      gap: 10px;
    }
    .search-container input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--snack-border);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .actions-bar {
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #fafafa;
      border-bottom: 1px solid var(--snack-border);
      font-size: 12px;
    }
    .actions-bar button {
      background: none;
      border: none;
      color: var(--snack-green);
      font-weight: bold;
      cursor: pointer;
      padding: 0;
    }
    .products-list-container {
      flex: 1;
      overflow-y: auto;
      background-color: var(--snack-paper);
      padding: 8px 0;
    }
    .product-row {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      border-bottom: 1px solid rgba(0,0,0,0.03);
      cursor: pointer;
      transition: background-color 0.1s;
    }
    .product-row:hover {
      background-color: rgba(30, 64, 24, 0.02);
    }
    .product-row input[type="checkbox"] {
      margin-right: 12px;
      accent-color: var(--snack-green);
      cursor: pointer;
    }
    .product-img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      border: 1px solid var(--snack-border);
      object-fit: contain;
      background-color: #fff;
      margin-right: 12px;
    }
    .product-details {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .product-name {
      font-size: 13px;
      font-weight: bold;
      margin: 0;
      color: var(--snack-text);
    }
    .product-meta {
      font-size: 11px;
      color: #666;
      margin: 2px 0 0 0;
    }
    .options-panel {
      padding: 12px 16px;
      background-color: #fafafa;
      border-top: 1px solid var(--snack-border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }
    .options-panel label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .options-panel input {
      accent-color: var(--snack-green);
    }
    .footer-actions {
      padding: 16px;
      background-color: var(--snack-paper);
      border-top: 1px solid var(--snack-border);
      display: flex;
      gap: 12px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 99px;
      font-weight: bold;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background-color: var(--snack-green);
      color: var(--snack-cream);
      box-shadow: 0 4px 12px rgba(30, 64, 24, 0.15);
    }
    .btn-primary:hover {
      background-color: #153011;
    }
    .btn-secondary {
      background-color: #e0e0e0;
      color: #333;
    }
    .btn-secondary:hover {
      background-color: #d0d0d0;
    }
    /* Panel de Progresso */
    #progress-panel {
      display: none;
      position: absolute;
      inset: 0;
      background-color: var(--snack-cream);
      padding: 30px 24px;
      z-index: 100;
      flex-direction: column;
      justify-content: space-between;
    }
    .progress-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--snack-green);
      margin: 0 0 8px 0;
    }
    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background-color: #e0e0e0;
      border-radius: 99px;
      overflow: hidden;
      margin: 16px 0;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background-color: var(--snack-green);
      border-radius: 99px;
      transition: width 0.2s;
    }
    .log-console {
      flex: 1;
      background-color: #1a1a1a;
      color: #00ff00;
      font-family: monospace;
      font-size: 11px;
      padding: 12px;
      border-radius: 8px;
      overflow-y: auto;
      margin: 16px 0;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>Importador de Catálogo</h1>
    <p>WhatsApp Web Catalog Automator • Snack Store</p>
  </header>

  <!-- Painel de Progresso -->
  <div id="progress-panel">
    <div>
      <h2 class="progress-title">Importando Produtos...</h2>
      <div id="progress-text">Aguardando início...</div>
      <div class="progress-bar-bg">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>
    </div>
    <div id="log-console" class="log-console"></div>
    <button id="btn-stop" class="btn btn-secondary">Parar Importação</button>
  </div>

  <!-- Painel Principal -->
  <div class="search-container">
    <input type="text" id="search-input" placeholder="Buscar por nome ou código...">
  </div>

  <div class="actions-bar">
    <span id="selected-counter">0 selecionados</span>
    <div>
      <button id="select-all">Marcar Todos</button>
      <span style="color: #ccc; margin: 0 6px;">|</span>
      <button id="deselect-all">Desmarcar</button>
    </div>
  </div>

  <div class="products-list-container" id="products-list">
    <!-- Linhas geradas via JavaScript -->
  </div>

  <div class="options-panel">
    <label>
      <input type="checkbox" id="opt-include-code" checked>
      Incluir código do produto no campo Código do Item
    </label>
    <label>
      <input type="checkbox" id="opt-include-link" checked>
      Incluir link do e-commerce no campo Link
    </label>
  </div>

  <div class="footer-actions">
    <button id="btn-start" class="btn btn-primary">Iniciar Importação</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
